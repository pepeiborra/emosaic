      Runtime: python3.11
      Handler: list_mosaics.lambda_handler
      Role: !ImportValue
        Fn::Sub: '${Environment}-mosaic-lambda-role-arn'
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': json.dumps({'message': 'Placeholder'})
              }
      Environment:
        Variables:
          MOSAICS_TABLE: !ImportValue
            Fn::Sub: '${Environment}-mosaics-table'
