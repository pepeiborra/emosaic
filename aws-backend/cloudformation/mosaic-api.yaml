  # /mosaics
  MosaicsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue
        Fn::Sub: '${Environment}-tile-flags-api-id'
      ParentId: !GetAtt APIRootResource.ResourceId
      PathPart: 'mosaics'

  APIRootResource:
    Type: Custom::GetRootResource
    Properties:
      ServiceToken: !GetAtt GetRootResourceFunction.Arn
      RestApiId: !ImportValue
        Fn::Sub: '${Environment}-tile-flags-api-id'

  GetRootResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-get-root-resource'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt GetRootResourceRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  api_id = event['ResourceProperties']['RestApiId']
                  client = boto3.client('apigateway')
                  response = client.get_resources(restApiId=api_id, limit=500)

                  root_id = None
                  for item in response['items']:
                      if item['path'] == '/':
                          root_id = item['id']
                          break

                  if root_id:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                     {'ResourceId': root_id}, root_id)
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED,
                                     {'Error': 'Root resource not found'})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                 {'Error': str(e)})
      Timeout: 30

  GetRootResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: APIGatewayAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:GET
                Resource: '*'

  # /mosaics/{mosaicId}
  MosaicIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue
        Fn::Sub: '${Environment}-tile-flags-api-id'
