AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 bucket for Emosaic Admin UI static hosting'

Parameters:
  Environment:
    Type: String
    Description: Environment name
    Default: 'prod'

  CustomDomain:
    Type: String
    Description: Custom domain name (e.g., admin.example.com). Leave empty for CloudFront default domain.
    Default: ''

  CertificateArn:
    Type: String
    Description: ARN of ACM certificate for custom domain (must be in us-east-1). Required if CustomDomain is set.
    Default: ''

  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for DNS record. Required if CustomDomain is set.
    Default: ''

  TilesBucketName:
    Type: String
    Description: Name of the S3 bucket containing tiles and mosaics
    Default: 'emosaic-tiles-prod'

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]

Resources:
  # Origin Access Control for tiles bucket
  TilesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Environment}-tiles-oac'
        Description: OAC for accessing tiles bucket from CloudFront
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminUIBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'emosaic-admin-${Environment}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: admin/index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: emosaic
        - Key: Environment
          Value: !Ref Environment

  AdminUIBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminUIBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource: !Sub '${AdminUIBucket.Arn}/*'

  AdminUIDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AdminUIBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: TilesOrigin
            DomainName: !Sub '${TilesBucketName}.s3.${AWS::Region}.amazonaws.com'
            OriginAccessControlId: !GetAtt TilesOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - - !Ref CustomDomain
          - !Ref 'AWS::NoValue'
        CacheBehaviors:
          - PathPattern: '/mosaics/*'
            TargetOriginId: TilesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
          - PathPattern: '/tiles/*'
            TargetOriginId: TilesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /admin/index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /admin/index.html
            ErrorCachingMinTTL: 300
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: emosaic
        - Key: Environment
          Value: !Ref Environment

  # Route 53 DNS record for custom domain
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt AdminUIDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)

Outputs:
  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref AdminUIBucket
    Export:
      Name: !Sub '${Environment}-emosaic-admin-bucket'

  WebsiteURL:
    Description: URL of the S3 website
    Value: !GetAtt AdminUIBucket.WebsiteURL
    Export:
      Name: !Sub '${Environment}-emosaic-admin-url'

  CloudFrontURL:
    Description: CloudFront distribution URL
    Value: !Sub 'https://${AdminUIDistribution.DomainName}'
    Export:
      Name: !Sub '${Environment}-emosaic-admin-cloudfront-url'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref AdminUIDistribution
    Export:
      Name: !Sub '${Environment}-emosaic-admin-cloudfront-id'

  CustomDomainURL:
    Condition: HasCustomDomain
    Description: Custom domain URL
    Value: !Sub 'https://${CustomDomain}'
    Export:
      Name: !Sub '${Environment}-emosaic-admin-custom-url'

  TilesBucketPolicyStatement:
    Description: 'Add this statement to the tiles bucket policy to allow CloudFront access'
    Value: !Sub |
      {
        "Sid": "AllowCloudFrontServicePrincipal-${Environment}",
        "Effect": "Allow",
        "Principal": {
          "Service": "cloudfront.amazonaws.com"
        },
        "Action": "s3:GetObject",
        "Resource": "arn:aws:s3:::${TilesBucketName}/*",
        "Condition": {
          "StringEquals": {
            "AWS:SourceArn": "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminUIDistribution}"
          }
        }
      }
