AWSTemplateFormatVersion: '2010-09-09'
Description: 'Emosaic Cloud Migration - Core Infrastructure (S3, DynamoDB, Cognito)'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    Description: Environment name

  AdminEmail:
    Type: String
    Description: Email address for the initial admin user

  CorsOrigin:
    Type: String
    Default: 'https://casadelmanco.com'
    Description: Primary CORS origin for API Gateway

  AdditionalCorsOrigins:
    Type: CommaDelimitedList
    Default: 'https://rc.casadelmanco.com'
    Description: Additional CORS origins (comma-separated)

  UseExistingBucket:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to use an existing S3 bucket instead of creating one

  ExistingTilesBucketName:
    Type: String
    Default: ''
    Description: Name of existing tiles bucket to use (required when UseExistingBucket=true)

  OAuthSecretName:
    Type: String
    Default: 'prod/casadelmanco/oauth'
    Description: Secrets Manager secret holding Google + Facebook OAuth credentials (keys google_client_id, google_client_secret, facebook_app_id, facebook_app_secret)

  CognitoDomainPrefix:
    Type: String
    Default: 'casadelmanco-auth'
    Description: Prefix for the Cognito hosted UI domain (becomes <prefix>-<env>.auth.<region>.amazoncognito.com — must be globally unique within the region)

Conditions:
  CreateBucket: !Equals [!Ref UseExistingBucket, 'false']

Resources:
  #############################################################################
  # S3 Bucket for Tile Storage
  #############################################################################
  TilesBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    Properties:
      BucketName: !Sub 'emosaic-tiles-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedOrigins:
              - !Ref CorsOrigin
              - !Select [0, !Ref AdditionalCorsOrigins]
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  TilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucket
    Properties:
      Bucket: !Ref TilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${TilesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

  #############################################################################
  # DynamoDB Tables
  #############################################################################

  # Mosaics table - stores mosaic metadata
  MosaicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-mosaics'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: is_main
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: by-created-at
          KeySchema:
            - AttributeName: is_main
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  # Jobs table - tracks mosaic generation jobs
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-mosaic-jobs'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: mosaic_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: started_at
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: by-mosaic-id
          KeySchema:
            - AttributeName: mosaic_id
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: by-status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  # Pending registrations table - stores registration requests awaiting approval
  PendingRegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-pending-registrations'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: by-status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  # Captcha table - stores captcha challenges with short TTL
  CaptchaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-captcha'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  # Error logs table - stores client-side error logs for monitoring
  ErrorLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-error-logs'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: server_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: by-category
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: server_timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  #############################################################################
  # Cognito Custom Message Lambda Trigger
  #############################################################################

  CustomMessageLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-custom-message-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CustomMessageFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-cognito-custom-message'
      Runtime: python3.11
      Handler: custom_message.lambda_handler
      Role: !GetAtt CustomMessageLambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - will be replaced by actual deployment
          def lambda_handler(event, context):
              return event
      Timeout: 10
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  CustomMessageLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CustomMessageFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  #############################################################################
  # Cognito User Pool for Admin Authentication
  #############################################################################

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Environment}-emosaic-admin-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      LambdaConfig:
        CustomMessage: !GetAtt CustomMessageFunction.Arn
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      AdminCreateUserConfig:
        # Federated sign-up (Google/Facebook) bypasses this flag — it only
        # gates the public SignUp API. Keep it true so nobody can self-signup
        # via email/password without an admin invite.
        AllowAdminCreateUserOnly: true
        # Note: InviteMessageTemplate is overridden by CustomMessage Lambda trigger
        InviteMessageTemplate:
          EmailMessage: 'Usuario: {username} - Contraseña temporal: {####}'
          EmailSubject: 'Invitación al Panel de Administración - Casa del Manco'
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailMessage: 'Tu código de verificación para Casa del Manco es: {####}'
        EmailSubject: 'Código de verificación - Casa del Manco'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        # Aligned with NIST SP 800-63B: prefer length over composition rules.
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Project: Emosaic
        Environment: !Ref Environment

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # Federated providers must exist before the client lists them.
    DependsOn:
      - GoogleIdentityProvider
      - FacebookIdentityProvider
    Properties:
      ClientName: !Sub '${Environment}-emosaic-admin-client'
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO
        - Google
        - Facebook
      CallbackURLs:
        - https://casadelmanco.com/admin/callback
        - http://localhost:5173/callback
      LogoutURLs:
        - https://casadelmanco.com/admin
        - http://localhost:5173
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true

  # Create initial admin user
  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref AdminUserPool
      Username: !Ref AdminEmail
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: 'true'
      DesiredDeliveryMediums:
        - EMAIL

  #############################################################################
  # Cognito Hosted UI domain + Federated Identity Providers
  #############################################################################

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref AdminUserPool
      Domain: !Sub '${CognitoDomainPrefix}-${Environment}'

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref AdminUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Sub '{{resolve:secretsmanager:${OAuthSecretName}:SecretString:google_client_id}}'
        client_secret: !Sub '{{resolve:secretsmanager:${OAuthSecretName}:SecretString:google_client_secret}}'
        authorize_scopes: 'openid email profile'
      AttributeMapping:
        email: email
        name: name
        email_verified: email_verified

  FacebookIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref AdminUserPool
      ProviderName: Facebook
      ProviderType: Facebook
      ProviderDetails:
        client_id: !Sub '{{resolve:secretsmanager:${OAuthSecretName}:SecretString:facebook_app_id}}'
        client_secret: !Sub '{{resolve:secretsmanager:${OAuthSecretName}:SecretString:facebook_app_secret}}'
        authorize_scopes: 'email public_profile'
        api_version: 'v18.0'
      AttributeMapping:
        email: email
        name: name

  #############################################################################
  # Pre-Sign-Up + Post-Confirmation Lambda Triggers (for federated sign-up)
  #############################################################################

  PreSignUpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-pre-signup-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-cognito-pre-signup'
      Runtime: python3.11
      Handler: pre_signup.lambda_handler
      Role: !GetAtt PreSignUpLambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - replaced by deploy-cloud.sh
          def lambda_handler(event, context):
              return event
      Timeout: 10
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  PreSignUpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreSignUpFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  PostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-post-confirmation-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  PostConfirmationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-cognito-post-confirmation'
      Runtime: python3.11
      Handler: post_confirmation.lambda_handler
      Role: !GetAtt PostConfirmationLambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - replaced by deploy-cloud.sh
          def lambda_handler(event, context):
              return event
      Environment:
        Variables:
          ADMIN_NOTIFICATION_EMAIL: !Ref AdminEmail
          ADMIN_EMAIL_FROM: 'noreply@casadelmanco.com'
          ADMIN_PANEL_URL: 'https://casadelmanco.com/admin'
      Timeout: 10
      Tags:
        - Key: Project
          Value: Emosaic
        - Key: Environment
          Value: !Ref Environment

  PostConfirmationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  #############################################################################
  # IAM Role for Mosaic Lambda Functions
  #############################################################################

  MosaicLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-mosaic-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt MosaicsTable.Arn
                  - !Sub '${MosaicsTable.Arn}/index/*'
                  - !GetAtt JobsTable.Arn
                  - !Sub '${JobsTable.Arn}/index/*'
                  - !GetAtt PendingRegistrationsTable.Arn
                  - !Sub '${PendingRegistrationsTable.Arn}/index/*'
                  - !GetAtt CaptchaTable.Arn
                  - !GetAtt ErrorLogsTable.Arn
                  - !Sub '${ErrorLogsTable.Arn}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !If
                    - CreateBucket
                    - !GetAtt TilesBucket.Arn
                    - !Sub 'arn:aws:s3:::${ExistingTilesBucketName}'
                  - !If
                    - CreateBucket
                    - !Sub '${TilesBucket.Arn}/*'
                    - !Sub 'arn:aws:s3:::${ExistingTilesBucketName}/*'
        - PolicyName: BatchSubmitJob
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                  - batch:TerminateJob
                Resource: '*'
        - PolicyName: AdminBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::emosaic-admin-${Environment}/*'
        - PolicyName: CloudFrontAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
        - PolicyName: CognitoUserManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                Resource: !GetAtt AdminUserPool.Arn

Outputs:
  TilesBucketName:
    Description: Name of the tiles S3 bucket
    Value: !If
      - CreateBucket
      - !Ref TilesBucket
      - !Ref ExistingTilesBucketName
    Export:
      Name: !Sub '${Environment}-emosaic-tiles-bucket'

  TilesBucketArn:
    Description: ARN of the tiles S3 bucket
    Value: !If
      - CreateBucket
      - !GetAtt TilesBucket.Arn
      - !Sub 'arn:aws:s3:::${ExistingTilesBucketName}'
    Export:
      Name: !Sub '${Environment}-emosaic-tiles-bucket-arn'

  MosaicsTableName:
    Description: Name of the mosaics DynamoDB table
    Value: !Ref MosaicsTable
    Export:
      Name: !Sub '${Environment}-mosaics-table'

  MosaicsTableArn:
    Description: ARN of the mosaics DynamoDB table
    Value: !GetAtt MosaicsTable.Arn
    Export:
      Name: !Sub '${Environment}-mosaics-table-arn'

  JobsTableName:
    Description: Name of the jobs DynamoDB table
    Value: !Ref JobsTable
    Export:
      Name: !Sub '${Environment}-mosaic-jobs-table'

  JobsTableArn:
    Description: ARN of the jobs DynamoDB table
    Value: !GetAtt JobsTable.Arn
    Export:
      Name: !Sub '${Environment}-mosaic-jobs-table-arn'

  PendingRegistrationsTableName:
    Description: Name of the pending registrations DynamoDB table
    Value: !Ref PendingRegistrationsTable
    Export:
      Name: !Sub '${Environment}-pending-registrations-table'

  PendingRegistrationsTableArn:
    Description: ARN of the pending registrations DynamoDB table
    Value: !GetAtt PendingRegistrationsTable.Arn
    Export:
      Name: !Sub '${Environment}-pending-registrations-table-arn'

  CaptchaTableName:
    Description: Name of the captcha DynamoDB table
    Value: !Ref CaptchaTable
    Export:
      Name: !Sub '${Environment}-captcha-table'

  ErrorLogsTableName:
    Description: Name of the error logs DynamoDB table
    Value: !Ref ErrorLogsTable
    Export:
      Name: !Sub '${Environment}-error-logs-table'

  ErrorLogsTableArn:
    Description: ARN of the error logs DynamoDB table
    Value: !GetAtt ErrorLogsTable.Arn
    Export:
      Name: !Sub '${Environment}-error-logs-table-arn'

  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref AdminUserPool
    Export:
      Name: !Sub '${Environment}-emosaic-user-pool-id'

  UserPoolArn:
    Description: ARN of the Cognito User Pool
    Value: !GetAtt AdminUserPool.Arn
    Export:
      Name: !Sub '${Environment}-emosaic-user-pool-arn'

  UserPoolClientId:
    Description: ID of the Cognito User Pool Client
    Value: !Ref AdminUserPoolClient
    Export:
      Name: !Sub '${Environment}-emosaic-user-pool-client-id'

  MosaicLambdaRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt MosaicLambdaRole.Arn
    Export:
      Name: !Sub '${Environment}-mosaic-lambda-role-arn'

  CustomMessageFunctionName:
    Description: Name of the Custom Message Lambda function
    Value: !Ref CustomMessageFunction
    Export:
      Name: !Sub '${Environment}-custom-message-function'

  CustomMessageFunctionArn:
    Description: ARN of the Custom Message Lambda function
    Value: !GetAtt CustomMessageFunction.Arn
    Export:
      Name: !Sub '${Environment}-custom-message-function-arn'

  PreSignUpFunctionName:
    Description: Name of the Pre-Sign-Up Lambda function
    Value: !Ref PreSignUpFunction
    Export:
      Name: !Sub '${Environment}-pre-signup-function'

  PostConfirmationFunctionName:
    Description: Name of the Post-Confirmation Lambda function
    Value: !Ref PostConfirmationFunction
    Export:
      Name: !Sub '${Environment}-post-confirmation-function'

  CognitoDomain:
    Description: Cognito hosted UI domain (use this in OAuth provider redirect URIs and frontend Amplify config)
    Value: !Sub '${CognitoDomainPrefix}-${Environment}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${Environment}-emosaic-cognito-domain'
