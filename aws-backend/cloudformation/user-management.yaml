AWSTemplateFormatVersion: '2010-09-09'
Description: 'Emosaic User Management API - Cognito user CRUD operations'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    Description: Environment name

  CorsOrigin:
    Type: String
    Default: 'https://casadelmanco.com'
    Description: CORS origin for API Gateway

Resources:
  #############################################################################
  # Lambda Function - User Management
  #############################################################################

  UserManagementFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-user-management'
      Runtime: python3.11
      Handler: user_management.lambda_handler
      Role: !GetAtt UserManagementRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps({'message': 'Placeholder'})}
      Environment:
        Variables:
          USER_POOL_ID: !ImportValue
            Fn::Sub: '${Environment}-emosaic-user-pool-id'
          CORS_ORIGIN: !Ref CorsOrigin
      Timeout: 30

  UserManagementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-user-management-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUserManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminGetUser
                Resource: !Sub
                  - 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
                  - UserPoolId: !ImportValue
                      Fn::Sub: '${Environment}-emosaic-user-pool-id'

  #############################################################################
  # Lambda Function - Registration (Public + Admin)
  #############################################################################

  RegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-registration'
      Runtime: python3.11
      Handler: registration.lambda_handler
      Role: !GetAtt RegistrationRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps({'message': 'Placeholder'})}
      Environment:
        Variables:
          USER_POOL_ID: !ImportValue
            Fn::Sub: '${Environment}-emosaic-user-pool-id'
          PENDING_REGISTRATIONS_TABLE: !ImportValue
            Fn::Sub: '${Environment}-pending-registrations-table'
          CAPTCHA_TABLE: !ImportValue
            Fn::Sub: '${Environment}-captcha-table'
          CORS_ORIGIN: !Ref CorsOrigin
          ADMIN_EMAIL_FROM: 'noreply@casadelmanco.com'
          ADMIN_PANEL_URL: !Sub 'https://casadelmanco.com/admin'
      Timeout: 30

  RegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-registration-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue
                        Fn::Sub: '${Environment}-pending-registrations-table'
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*'
                    - TableName: !ImportValue
                        Fn::Sub: '${Environment}-pending-registrations-table'
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue
                        Fn::Sub: '${Environment}-captcha-table'
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                Resource: !Sub
                  - 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
                  - UserPoolId: !ImportValue
                      Fn::Sub: '${Environment}-emosaic-user-pool-id'
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  #############################################################################
  # Lambda Function - Captcha (Public)
  #############################################################################

  CaptchaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-captcha'
      Runtime: python3.11
      Handler: captcha.lambda_handler
      Role: !GetAtt CaptchaRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps({'message': 'Placeholder'})}
      Environment:
        Variables:
          CAPTCHA_TABLE: !ImportValue
            Fn::Sub: '${Environment}-captcha-table'
          CORS_ORIGIN: !Ref CorsOrigin
      Timeout: 10

  CaptchaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-captcha-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue
                        Fn::Sub: '${Environment}-captcha-table'

  #############################################################################
  # API Gateway Resources
  #############################################################################

  # Helper to get root resource
  APIRootResource:
    Type: Custom::GetRootResource
    Properties:
      ServiceToken: !GetAtt GetRootResourceFunction.Arn
      RestApiId: !ImportValue
        Fn::Sub: '${Environment}-tile-flags-api-id'

  GetRootResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-get-root-resource-users'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt GetRootResourceRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  api_id = event['ResourceProperties']['RestApiId']
                  client = boto3.client('apigateway')
                  response = client.get_resources(restApiId=api_id, limit=500)

                  root_id = None
                  for item in response['items']:
                      if item['path'] == '/':
                          root_id = item['id']
                          break

                  if root_id:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                     {'ResourceId': root_id}, root_id)
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED,
                                     {'Error': 'Root resource not found'})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                 {'Error': str(e)})
      Timeout: 30

  GetRootResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: APIGatewayAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:GET
                Resource: '*'

  # /users resource
  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue
        Fn::Sub: '${Environment}-tile-flags-api-id'
      ParentId: !GetAtt APIRootResource.ResourceId
      PathPart: 'users'

  # /users/{username} resource
